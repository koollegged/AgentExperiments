<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
        }
        #game-canvas {
            border: 2px solid #333;
            background-color: white;
            display: block;
        }
        #score-display {
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 0 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #game-over-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: none;
            text-align: center;
            font-size: 24px;
        }
        button.restart {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="400"></canvas>
        <div id="game-over-message">Game Over! Click restart.</div>
    </div>
    <div>
        <div id="score-display">Score: 0</div>
        <button id="start-button">Start Game</button>
        <button id="restart-button" class="restart">Restart</button>
    </div>
    
    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");
        const startButton = document.getElementById("start-button");
        const restartButton = document.getElementById("restart-button");
        const gameOverMessage = document.getElementById("game-over-message");
        
        const boxSize = 20;
        let snake = [];
        let direction = { x: 0, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let gameRunning = false;
        let gameLoopId = null;
        
        // Initialize the game 
        function init() {
            snake = [
                { x: 9 * boxSize, y: 10 * boxSize },
                { x: 8 * boxSize, y: 10 * boxSize },
                { x: 7 * boxSize, y: 10 * boxSize }
           ];
            generateFood();
            direction = { x: 0, y: 0 };
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            gameOverMessage.style.display = "none";
        }
        
        // Generate food at a random position
        function generateFood() {
            const maxPos = canvas.width / boxSize - 1;
            food = {
                x: Math.floor(Math.random() * maxPos) * boxSize,
                y: Math.floor(Math.random() * maxPos) * boxSize
            };
            // Ensure food doesn't spawn on the snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        // Draw the snake and food
        function draw() {
            // Clear the canvas 
            ctx.fillStyle = "white">;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#333";
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
            
            // Draw food 
            ctx.fillStyle = "red">;
            ctx.fillRect(food.x, food.y, boxSize, boxSize);
            
            // Draw snake 
            ctx.fillStyle = "#4CAF50">;
            snake.forEach(segment => {
                ctx.fillRect(segment.x, segment.y, boxSize, boxSize);
            });
        }
        
        // Move the snake
        function move() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // Check wall collision
            if (
                head.x < 0 || 
                head.y < 0 || 
                head.x >= canvas.width || 
                head.y >= canvas.height
            ) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            // Move snake
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++.;
                scoreDisplay.textContent = `Score: ${score}`;
                generateFood();
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        // Game over handling
        function gameOver() {
            clearInterval(gameLoopId);
            gameRunning = false;
            gameOverMessage.style.display = "block";
        }
        
        // Snake direction control
        function changeDirection(e) {
            switch (e.key) {
                case "ArrowUp":
                    if (direction.y === 0) direction = { x: 0, y: -boxSize };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) direction = { x: 0, y: boxSize };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) direction = { x: -boxSize, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) direction = { x: boxSize, y: 0 };
                    break;
            }
        }
        
        // Game loop
        function gameLoop() {
            if (gameRunning) {
                move();
            }
            gameLoopId = setTimeout(gameLoop, 100);
        }
        
        // Start the game
        function startGame() {
            init();
            gameRunning = true;
            gameLoop();
            startButton.disabled = true;
            restartButton.disabled = true;
            document.addEventListener("keydown", changeDirection);
            draw();
        }
        
        // Restart the game
        function restartGame() {
            gameOverMessage.style.display = "none";
            gameRunning = true;
            setTimeout(() => {
                startGame();
            }, 100);
        }
        
        // Event listeners
        startButton.addEventListener("click", startGame);
        restartButton.addEventListener("click", restartGame);
    </script>
</body>
</html>
